<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>GEPT 初級說寫練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 刻意只做明亮主題：給小朋友用的活潑配色 */
:root{
  color-scheme:light;
  --bg:#fff8ec; --card:#ffffff; --ink:#2d2a32; --muted:#6b6577; --line:#f0e2cc;
  --ai:#7c3aed; --aibg:#f4efff;
  --pri:#ff7a45; --ok:#1f9d63; --okbg:#e3f8ec; --bad:#e5484d; --badbg:#ffecec;
  --blue:#3b82f6; --purple:#8b5cf6; --teal:#14b8a6; --pink:#ec4899; --amber:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:22px;line-height:1.6}
.en{font-family:"Segoe UI","Nunito",Arial,sans-serif;letter-spacing:.2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#ff7a45}
header{background:linear-gradient(135deg,#ff7a45,#ffb347);color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.12)}
header h1{margin:0;font-size:28px;cursor:pointer;white-space:nowrap}
.countdown{background:rgba(255,255,255,.28);border-radius:999px;padding:4px 16px;font-weight:700}
header .homebtn{margin-left:auto;background:#fff;color:var(--pri);box-shadow:none;min-height:48px;padding:8px 18px}
main{max-width:960px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ai-only,.img-only{display:none!important}
body.has-ai .ai-only,body.has-img .img-only{display:revert!important}
body.has-img label.img-only{display:inline-flex!important}
label.btn{display:inline-flex;align-items:center}
.sel{font:inherit;font-size:22px;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);min-height:52px;max-width:100%}
.paper-tip{background:#fff6d6;border-radius:14px;padding:10px 14px;margin:12px 0;font-size:20px}
ol.sheet{padding-left:40px;margin:8px 0}
ol.sheet>li{padding:14px 0;border-bottom:2px dashed var(--line)}
ol.sheet>li::marker{font-weight:800;color:var(--pri)}
.sq-inst{font-weight:700}
.sq{font-size:26px;font-weight:600;line-height:1.5}
.tok{display:inline-block;background:#eef4ff;color:#1e3a8a;border-radius:8px;padding:0 10px;margin:3px 2px}
.key{margin-top:10px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checklist input{width:24px;height:24px;margin-top:6px;flex:none}
body.has-ai .no-ai{display:none!important}
.btn.ai{background:var(--ai)}
.aibox{background:var(--aibg);border:3px solid #d9c9ff;border-radius:18px;padding:16px 20px;margin-top:16px}
.aibox .fbt{color:var(--ai)}
.aibox ul{margin:6px 0;padding-left:24px}
.fix{background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:20px}
.fix .from{color:#b42318;text-decoration:line-through}
.fix .to{color:var(--ok);font-weight:700}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick .btn{min-height:52px;padding:8px 18px}
.pick .btn.sec.active{border-color:var(--ai);color:var(--ai);background:var(--aibg)}
.thinking{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.thinking,.pulse{animation:none}}
h2{font-size:30px;margin:8px 0 14px}
h3{font-size:24px;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tile{border:none;border-radius:22px;padding:20px 22px;text-align:left;color:#fff;font:inherit;font-size:25px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.16);transition:transform .08s}
.tile .emo{font-size:42px;display:block;line-height:1.2}
.tile small{display:block;font-size:17px;font-weight:500;opacity:.95;margin-top:4px}
.tile:hover{filter:brightness(1.05)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 4px 14px rgba(120,80,20,.08);margin-bottom:18px}
.btn{font:inherit;font-size:22px;font-weight:700;border:none;border-radius:16px;padding:12px 24px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:60px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.sec{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.blue{background:var(--blue)} .btn.green{background:var(--ok)} .btn.red{background:var(--bad)} .btn.purple{background:var(--purple)} .btn.teal{background:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.mini{font:inherit;font-size:22px;border:none;background:#fff1e6;border-radius:12px;padding:2px 10px;cursor:pointer;vertical-align:middle}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.muted{color:var(--muted)} .small{font-size:18px}
input.ans,textarea{width:100%;font-size:26px;padding:14px 18px;border:3px solid var(--line);border-radius:16px;font-family:"Segoe UI",Arial,sans-serif;background:#fffdf9;color:var(--ink)}
input.ans:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff}
textarea{min-height:260px;line-height:1.7;resize:vertical}
.qhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700}
.badge{display:inline-block;color:#fff;border-radius:999px;padding:2px 14px;font-size:18px;font-weight:700}
.bar{height:14px;background:#f6ead8;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.bar>div{height:100%;background:linear-gradient(90deg,#ffb347,#ff7a45);border-radius:999px;transition:width .3s}
.inst{font-size:24px;font-weight:700;margin-bottom:10px}
.hint{color:var(--muted);font-weight:500;font-size:20px}
.big-en{font-size:32px;font-weight:700;margin:6px 0 18px;line-height:1.4}
.big-en u{text-decoration-color:var(--pri);text-decoration-thickness:4px;text-underline-offset:6px}
.conj{display:inline-block;background:var(--blue);color:#fff;border-radius:12px;padding:0 14px;font-size:28px}
.fb{border-radius:18px;padding:16px 20px;margin-top:16px}
.fb.ok{background:var(--okbg);border:3px solid var(--ok)}
.fb.bad{background:var(--badbg);border:3px solid var(--bad)}
.fbt{font-size:28px;font-weight:800;margin-bottom:6px}
.right{font-size:28px;font-weight:700;color:var(--ok)}
.said{font-size:26px}
.exp{margin-top:10px;background:#fff;border-radius:14px;padding:10px 14px;font-size:22px}
.slots{min-height:84px;border:3px dashed #e7d3b3;border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fffdf9;margin:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.chip{font:inherit;font-family:"Segoe UI",Arial,sans-serif;font-size:27px;font-weight:600;padding:8px 18px;border-radius:14px;border:3px solid #c7dbff;background:#eef4ff;color:#1e3a8a;cursor:pointer;box-shadow:0 3px 0 #c7dbff}
.chip.on{background:#fff4e6;border-color:#ffc58f;color:#9a3412;box-shadow:0 3px 0 #ffc58f}
.chip.used{visibility:hidden}
.chip:disabled{cursor:default}
.punct{font-size:30px;font-weight:800;color:var(--muted)}
.w-bad{background:#ffd3d3;color:#b42318;border-radius:6px;padding:0 4px;text-decoration:underline wavy #e5484d}
.w-need{color:var(--ok);font-weight:800;text-decoration:underline;text-decoration-thickness:3px}
.w-ok{color:var(--ok)}
.w-miss{background:#ffd3d3;color:#b42318;border-radius:6px;padding:0 4px;font-weight:700}
.w-extra{background:#fff0c2;color:#92400e;border-radius:6px;padding:0 4px}
.diffline{font-size:28px;line-height:1.8}
.live{min-height:40px;font-size:24px;color:var(--blue);margin-top:10px}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(229,72,77,.25)}}
.timer{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:800;background:#fff;border:10px solid var(--teal);color:var(--teal);margin:10px auto}
.timer.hot{border-color:var(--bad);color:var(--bad)}
.hidebox{font-size:22px;color:var(--muted);background:#fbf3e6;border-radius:16px;padding:16px;text-align:center}
.score{font-size:40px;font-weight:800}
.split{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.wh{background:#fff8ef;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:19px;line-height:1.5}
.wh b{color:var(--pri);font-size:21px}
.wc{font-size:24px;font-weight:800}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tabs .btn{min-height:52px;padding:8px 20px}
.tabs .btn.sec.active{border-color:var(--pri);color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:20px}
th,td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left}
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0;border-bottom:3px solid var(--line)}
.bars div{flex:1;background:linear-gradient(180deg,#ffb347,#ff7a45);border-radius:10px 10px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;top:-26px;left:0;right:0;text-align:center;font-size:16px;font-weight:700}
.wl-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line);font-size:20px}
.wl-item .en{flex:1}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2d2a32;color:#fff;padding:12px 24px;border-radius:999px;font-size:22px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
audio{width:100%;max-width:480px;margin-top:8px}
@media (max-width:720px){
  body{font-size:19px}
  .split{grid-template-columns:1fr}
  .big-en{font-size:26px}
  .chip{font-size:22px;padding:6px 12px}
  header h1{font-size:22px}
}
</style>
<header>
  <h1 onclick="go('home')">🦉 GEPT 初級說寫練習</h1>
  <span class="countdown" id="countdown"></span>
  <button class="btn homebtn" onclick="go('home')">🏠 首頁</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ================= 題庫 ================= */
const REWRITE = [
  {k:'改成否定句', q:'Tom likes apples.', a:['Tom does not like apples.'], e:'主詞 Tom 是第三人稱單數，否定要用 does not（doesn\'t），後面的動詞改回原形 like。'},
  {k:'改成疑問句', q:'She is a teacher.', a:['Is she a teacher?'], e:'有 be 動詞（is）的句子，把 is 移到句首就是疑問句，句尾用問號。'},
  {k:'改成過去式', h:'把 every day 換成 yesterday', q:'I go to school every day.', a:['I went to school yesterday.','Yesterday I went to school.'], e:'過去式要用 went！go 是不規則動詞，不是 goed。'},
  {k:'改成否定句', q:'They played basketball yesterday.', a:['They did not play basketball yesterday.'], e:'過去式的否定用 did not（didn\'t），後面動詞要改回原形 play。'},
  {k:'改成疑問句', q:'You can swim.', a:['Can you swim?'], e:'有助動詞 can 的句子，把 can 移到句首就變成疑問句。'},
  {k:'改成現在進行式', q:'My mother cooks dinner.', a:['My mother is cooking dinner.','My mother is cooking dinner now.'], e:'現在進行式 = am / is / are + V-ing，cooks 變成 is cooking。'},
  {k:'改成未來式', h:'用 will，並加上 tomorrow', q:'I visit my grandparents.', a:['I will visit my grandparents tomorrow.','Tomorrow I will visit my grandparents.'], e:'未來式用 will + 原形動詞，表示「將會」。'},
  {k:'改成疑問句', q:'He has a dog.', a:['Does he have a dog?'], e:'一般動詞的疑問句：主詞是 he，句首加 Does，has 要改回原形 have。'},
  {k:'改成過去式', q:'We are happy.', a:['We were happy.'], e:'are 的過去式是 were；am、is 的過去式是 was。'},
  {k:'改成否定句', q:'There is a cat under the table.', a:['There is not a cat under the table.','There is no cat under the table.'], e:'There is 的否定是在 is 後面加 not（isn\'t），也可以說 There is no cat。'},
  {k:'改用 be going to', q:'She will buy a new bike.', a:['She is going to buy a new bike.'], e:'will 和 be going to 都是未來式；主詞 She 要用 is going to + 原形動詞。'},
  {k:'改成疑問句', q:'Amy watched TV last night.', a:['Did Amy watch TV last night?'], e:'過去式的疑問句在句首加 Did，watched 要改回原形 watch。'},
  {k:'用 Where 問劃線的部分', q:'Ben lives in Taipei.', u:'in Taipei', a:['Where does Ben live?'], e:'問「地點」用 Where，後面接 does + 主詞 + 原形動詞 live。'},
  {k:'用 What time 問劃線的部分', q:'The movie starts at seven.', u:'at seven', a:['What time does the movie start?'], e:'問「幾點」用 What time；the movie 是單數，用 does，starts 改回 start。'},
  {k:'改成過去進行式', h:'把 now 換成 at eight last night', q:'I am reading a book now.', a:['I was reading a book at eight last night.','At eight last night I was reading a book.'], e:'過去進行式 = was / were + V-ing，表示過去某個時間「正在」做的事。'},
  {k:'改成肯定句', q:'Mary doesn\'t like milk.', a:['Mary likes milk.'], e:'拿掉 doesn\'t 之後，主詞 Mary 是第三人稱單數，動詞要加 s 變成 likes。'},
  {k:'把主詞換成 He', q:'I eat breakfast at seven.', a:['He eats breakfast at seven.'], e:'主詞是 He（第三人稱單數），現在式動詞要加 s：eat → eats。'},
  {k:'用 Who 問劃線的部分', q:'Kevin broke the window.', u:'Kevin', a:['Who broke the window?'], e:'問「誰」做了某事，Who 直接當主詞，動詞維持 broke 不用變。'},
  {k:'改成否定句', q:'My brother can drive a car.', a:['My brother cannot drive a car.'], e:'can 的否定是 cannot（can\'t），後面動詞維持原形 drive。'},
  {k:'改成疑問句', q:'They will come to the party.', a:['Will they come to the party?'], e:'有 will 的句子，把 will 移到句首就變成疑問句。'},
];
const COMBINE = [
  {s1:'I was hungry.', s2:'I ate a sandwich.', c:'so', a:['I was hungry, so I ate a sandwich.'], e:'so 表示「所以」：前面是原因、後面是結果；so 前面通常加逗號。'},
  {s1:'I like dogs.', s2:'My sister likes cats.', c:'but', a:['I like dogs, but my sister likes cats.'], e:'but 表示「但是」，連接兩個不一樣或相反的事情。My 在句中改小寫 my。'},
  {s1:'Tom stayed home.', s2:'He was sick.', c:'because', a:['Tom stayed home because he was sick.','Because he was sick, Tom stayed home.'], e:'because 表示「因為」，後面接原因；He 在句子中間要改成小寫 he。'},
  {s1:'She can sing.', s2:'She can dance.', c:'and', a:['She can sing and dance.','She can sing, and she can dance.','She can sing and she can dance.'], e:'and 表示「而且」；主詞和 can 都一樣時，可以省略，直接說 sing and dance。'},
  {s1:'It was raining.', s2:'We didn\'t go out.', c:'so', a:['It was raining, so we didn\'t go out.'], e:'下雨是原因，沒出門是結果，用 so 連接。'},
  {s1:'The bag is nice.', s2:'It is too expensive.', c:'but', a:['The bag is nice, but it is too expensive.'], e:'「好看」和「太貴」意思相反，用 but 連接。'},
  {s1:'I am tired.', s2:'I studied all night.', c:'because', a:['I am tired because I studied all night.','Because I studied all night, I am tired.'], e:'熬夜讀書是累的「原因」，放在 because 後面。'},
  {s1:'Ann went to the park.', s2:'She played tennis.', c:'and', a:['Ann went to the park and played tennis.','Ann went to the park, and she played tennis.','Ann went to the park and she played tennis.'], e:'兩件事依序發生，用 and 連接；主詞是同一個人時可以省略 she。'},
  {s1:'He studied hard.', s2:'He passed the test.', c:'so', a:['He studied hard, so he passed the test.'], e:'認真讀書（原因）→ 通過考試（結果），用 so。第二個 He 要改小寫。'},
  {s1:'I want to buy the book.', s2:'I don\'t have money.', c:'but', a:['I want to buy the book, but I don\'t have money.','I want to buy the book, but I don\'t have any money.'], e:'but 連接「想買」和「沒錢」兩個相反的情況。'},
  {s1:'We like summer.', s2:'We can swim in the sea.', c:'because', a:['We like summer because we can swim in the sea.','Because we can swim in the sea, we like summer.'], e:'可以去海邊游泳是喜歡夏天的「原因」，用 because。'},
  {s1:'My father is a doctor.', s2:'My mother is a nurse.', c:'and', a:['My father is a doctor, and my mother is a nurse.'], e:'and 可以連接兩個並列的事實；第二個 My 改小寫。'},
  {s1:'The soup was hot.', s2:'I waited a few minutes.', c:'so', a:['The soup was hot, so I waited a few minutes.'], e:'湯太燙（原因）→ 等幾分鐘（結果），用 so。'},
  {s1:'Jack is tall.', s2:'His brother is short.', c:'but', a:['Jack is tall, but his brother is short.'], e:'tall 和 short 意思相反，用 but。His 在句中改小寫 his。'},
  {s1:'Lisa is happy.', s2:'She got a gift.', c:'because', a:['Lisa is happy because she got a gift.','Because she got a gift, Lisa is happy.'], e:'收到禮物是開心的原因，用 because。'},
  {s1:'I brushed my teeth.', s2:'I went to bed.', c:'and', a:['I brushed my teeth and went to bed.','I brushed my teeth, and I went to bed.','I brushed my teeth and I went to bed.','I brushed my teeth and then went to bed.','I brushed my teeth, and then I went to bed.'], e:'兩個動作依序發生，用 and 連接，兩個動詞都是過去式。'},
  {s1:'The store was closed.', s2:'I went home.', c:'so', a:['The store was closed, so I went home.'], e:'商店關門（原因）→ 回家（結果），用 so。'},
  {s1:'Peter can\'t come.', s2:'He has to work.', c:'because', a:['Peter can\'t come because he has to work.','Because he has to work, Peter can\'t come.'], e:'要上班是不能來的原因，用 because。'},
];
const REORDER = [
  {s:'My brother is playing the guitar now.', zh:'我哥哥現在正在彈吉他。', alt:['Now my brother is playing the guitar.'], e:'現在進行式：主詞 + is + V-ing（playing）。'},
  {s:'Did you see the movie last night?', zh:'你昨晚有看那部電影嗎？', e:'過去式疑問句：Did + 主詞 + 原形動詞，時間 last night 放句尾。'},
  {s:'We are going to visit our aunt next week.', zh:'我們下星期要去拜訪阿姨。', alt:['Next week we are going to visit our aunt.'], e:'未來式：be going to + 原形動詞。'},
  {s:'She doesn\'t like to eat carrots.', zh:'她不喜歡吃紅蘿蔔。', e:'否定句：主詞 + doesn\'t + 原形動詞 like。'},
  {s:'What time do you get up every morning?', zh:'你每天早上幾點起床？', e:'疑問詞 What time + do + 主詞 + 原形動詞。'},
  {s:'My mother made a cake for me.', zh:'我媽媽做了一個蛋糕給我。', e:'句型「主詞 + 動詞 + 受詞」：made a cake，for me 表示「給我」。'},
  {s:'The little girl looks very happy.', zh:'那個小女孩看起來很開心。', e:'句型「主詞 + 連綴動詞 + 補語」：looks 後面接形容詞 happy。'},
  {s:'He gave his friend a nice present.', zh:'他送他朋友一個很棒的禮物。', e:'句型「主詞 + 動詞 + 人 + 物」：gave + his friend + a nice present。'},
  {s:'They call the dog Lucky.', zh:'他們叫那隻狗 Lucky。', e:'句型「主詞 + 動詞 + 受詞 + 補語」：call the dog Lucky。', keep:['Lucky']},
  {s:'Where were you at nine last night?', zh:'你昨晚九點在哪裡？', e:'be 動詞過去式的問句：Where + were + you。'},
  {s:'I was doing my homework when you called.', zh:'你打電話來的時候，我正在寫功課。', alt:['When you called I was doing my homework.'], e:'過去進行式 was doing 表示「當時正在做」。'},
  {s:'Can you help me carry the box?', zh:'你可以幫我搬這個箱子嗎？', e:'Can 放句首變疑問句；help + 人 + 原形動詞。'},
  {s:'I wore a coat because it was cold.', zh:'因為很冷，所以我穿了外套。', alt:['Because it was cold I wore a coat.'], e:'because 後面接原因 it was cold。'},

// 比對用：小寫、展開縮寫、數字統一、去標點
const NUM={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50'};
function norm(s){
  s=' '+String(s).toLowerCase().replace(/[’‘`´]/g,"'")+' ';
  s=s.replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not')
     .replace(/n't\b/g,' not').replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'ll\b/g,' will')
     .replace(/'ve\b/g,' have').replace(/\b(it|he|she|that|what|there|where|who|here|how)'s\b/g,'$1 is')
     .replace(/\blet's\b/g,'let us');
  s=s.replace(/'/g,'').replace(/[^a-z0-9 ]+/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>NUM[w]||w).join(' ');
}
function tokenize(s){return String(s).split(/\s+/).filter(Boolean).map(t=>({disp:t,parts:norm(t).split(' ').filter(Boolean)}))}
function lcs(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ma=new Array(n).fill(false),mb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ma[i]=mb[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return [ma,mb];
}
// 比較目標句與學生句子，回傳每個字有沒有對上
function compare(target,said){
  const A=tokenize(target),B=tokenize(said);
  const flat=T=>{const f=[],ix=[];T.forEach((t,k)=>t.parts.forEach(p=>{f.push(p);ix.push(k)}));return [f,ix]};
  const [fa,ia]=flat(A),[fb,ib]=flat(B);
  const [ma,mb]=lcs(fa,fb);
  const okA=A.map(()=>true),okB=B.map(()=>true);
  ma.forEach((ok,x)=>{if(!ok)okA[ia[x]]=false});
  mb.forEach((ok,x)=>{if(!ok)okB[ib[x]]=false});
  const hit=ma.filter(Boolean).length;
  return {A,okA,B,okB,hit,total:fa.length,score:fa.length?Math.round(hit/fa.length*100):0};
}

const MOBILE=/Android|iPhone|iPad/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
const REC_AUDIO=!(MOBILE&&SRClass);
const Rec={
  stream:null,mr:null,chunks:[],sr:null,on:false,committed:'',finalText:'',interim:'',srError:null,srEnded:true,_srResolve:null,
  async start(onText){
    this.mr=null;
    if(REC_AUDIO){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw {name:'NoMedia'};
      if(!this.stream||!this.stream.active)this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
      this.chunks=[];this.mr=new MediaRecorder(this.stream);
      this.mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};
      this.mr.start();
    }
    this.on=true;
    this.committed='';this.finalText='';this.interim='';this.srError=null;this.sr=null;
    if(SRClass){
      try{
        const r=new SRClass();r.lang='en-US';r.continuous=true;r.interimResults=true;
        r.onresult=e=>{let f='',it='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)f+=t+' ';else it+=t}
          this.finalText=f;this.interim=it;onText&&onText((this.committed+' '+f+' '+it).trim())};
        r.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')this.srError=e.error};
        r.onend=()=>{
          // Chrome 會因為停頓自動結束辨識，錄音還在進行就接著重新開始
          if(this.on&&!this.srError){this.committed+=' '+this.finalText+' '+this.interim;this.finalText='';this.interim='';try{r.start();return}catch(e){}}
          this.srEnded=true;if(this._srResolve)this._srResolve();
        };
        this.srEnded=false;r.start();this.sr=r;
      }catch(e){this.sr=null;this.srEnded=true}
    }
  },
  async stop(){
    this.on=false;
    const mrP=new Promise(r=>{
      if(!this.mr||this.mr.state==='inactive'){r(null);return}
      this.mr.onstop=()=>r(URL.createObjectURL(new Blob(this.chunks,{type:this.mr.mimeType||'audio/webm'})));
      this.mr.stop();
    });
    const srP=new Promise(r=>{
      if(!this.sr||this.srEnded){r();return}
      this._srResolve=r;try{this.sr.stop()}catch(e){r()}setTimeout(r,2500);
    });
    const [url]=await Promise.all([mrP,srP]);
    this._srResolve=null;this.sr=null;
    const text=(this.committed+' '+this.finalText+' '+this.interim).replace(/\s+/g,' ').trim();
    return {url,text,err:this.srError};
  },
  abort(){if(this.on){this.stop()}}
};

  if(given){

  }else if(wrongMode){
    pool=Object.keys(DB.wrong).map(getQ).filter(Boolean);
    if(type&&type!=='all')pool=pool.filter(q=>q.type===type);
    pool=shuffle(pool).slice(0,15);
    if(!pool.length){toast('錯題本是空的 🎉');viewWrong();return}
  }else{
    pool=shuffle(bankFor(type).slice()).slice(0,10);
  }
  R={type,mode:wrongMode?'wrong':type,wrongMode:!!wrongMode,items:pool,i:0,correct:0,count:0,done:false,wrongIds:[]};
  paperMode()?renderSheet():renderQ();
}
const paperMode=()=>DB.paper!==false;
function setPaper(v){DB.paper=v;save()}
const answersOf=q=>q.type==='reorder'?[q.s,...(q.alt||[])]:q.a;
function scramble(q){
  const keep=new Set(['I',...(q.keep||[])]);
  const toks=q.s.replace(/[.?!]$/,'').split(' ').map((w,i)=>i===0&&!keep.has(w)?w[0].toLowerCase()+w.slice(1):w);
  let order;do{order=shuffle(toks.map((_,i)=>i))}while(toks.length>2&&order.every((v,i)=>v===i));
  return {tokens:order.map(i=>toks[i]),punct:q.s.slice(-1)};
}

/* ================= 紙筆模式：看題目寫在紙上，再對答案 ================= */
function sheetQ(q,i){

}
function roundBadge(){const info=MODE[R.mode];return `<span class="badge" style="background:${info.color}">${info.name}</span>`}
function renderSheet(){

  app.innerHTML=`<div class="card">

function flushRound(){if(R&&!R.done&&R.count>0)logHistory(R.mode,R.correct,R.count);R=null}
function renderQ(){

  }

    <div class="qhead"><span class="badge" style="background:${info.color}">${R.wrongMode?'📕 錯題複習・':''}${info.name}</span>

      ${R.i===0&&!R.count?`<button class="btn sec" onclick="setPaper(true);renderSheet()">📄 改用紙筆寫</button>`:''}</div>
    <div id="fb"></div></div>`;
  if(q.type==='reorder')drawReorder();
  else{const inp=$('#ans');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();R.answered?nextQ():checkAns()}}}

function drawReorder(){
  const cap=w=>w[0].toUpperCase()+w.slice(1);
  $('#slots').innerHTML=R.sel.map((ti,k)=>`<button class="chip on" ${R.answered?'disabled':''} onclick="unpickWord(${k})">${esc(k===0?cap(R.tokens[ti]):R.tokens[ti])}</button>`).join('')
    +(R.sel.length?`<span class="punct">${esc(R.punct)}</span>`:'<span class="muted small">👇 從下面點單字</span>');
  $('#bank').innerHTML=R.tokens.map((t,i)=>`<button class="chip ${R.sel.includes(i)?'used':''}" ${R.answered?'disabled':''} onclick="pickWord(${i})">${esc(t)}</button>`).join('');
}
function pickWord(i){if(R.answered||R.sel.includes(i))return;R.sel.push(i);drawReorder()}
function unpickWord(k){if(R.answered)return;R.sel.splice(k,1);drawReorder()}
function undoWord(){if(R.answered)return;R.sel.pop();drawReorder()}
function clearWords(){if(R.answered)return;R.sel=[];drawReorder()}
function checkAns(skip){
  if(!R||R.answered)return;
  const q=R.items[R.i];let user;
  if(q.type==='reorder'){
    if(!skip&&R.sel.length<R.tokens.length){toast('還有單字沒用到喔！');return}
    user=R.sel.map(i=>R.tokens[i]).join(' ');
  }else{
    user=$('#ans').value.trim();
    if(!skip&&!user){toast('先寫答案再檢查喔！');return}
  }
  const answers=q.type==='reorder'?[q.s,...(q.alt||[])]:q.a;
  const ok=!skip&&answers.some(a=>norm(a)===norm(user));
  R.answered=true;R.count++;
  if(ok){R.correct++;if(R.wrongMode)delete DB.wrong[q.id]}
  else{const w=DB.wrong[q.id]||{n:0};w.n++;w.t=Date.now();DB.wrong[q.id]=w;R.wrongIds.push(q.id)}
  save();
  // 和學生答案最接近的正確答案拿來比對
  let right=answers[0];
  if(user){let best=-1;answers.forEach(a=>{const c=compare(a,user);if(c.hit>best){best=c.hit;right=a}})}
  R.lastRight=right;R.lastUser=user;
  let h=ok?`<div class="fb ok"><div class="fbt">🎉 答對了！${pick(PRAISE)}</div>`
          :`<div class="fb bad"><div class="fbt">💪 ${skip?'沒關係，一起看正確答案':'差一點點！'}</div>`;
  if(!ok&&user){
    const c=compare(right,user);
    h+=`<div class="muted small">你寫的（<span class="w-bad">紅色</span>是不對或多出來的字）：</div><div class="said en">${wordsHTML(c.B,c.okB,'',`w-bad`)}</div>
        <div class="muted small" style="margin-top:8px">正確答案（<span class="w-need">綠色底線</span>是你少寫或寫錯的地方）：</div>
        <div class="right en">${wordsHTML(c.A,c.okA,'','w-need')} <button class="mini" onclick="speak(R.lastRight)">🔊</button></div>`;
  }else{
    h+=`<div class="muted small">${ok?'正確答案':'正確答案：'}</div><div class="right en">${esc(right)} <button class="mini" onclick="speak(R.lastRight)">🔊</button></div>`;
  }
  const others=answers.filter(a=>a!==right);
  if(others.length&&q.type!=='reorder')h+=`<div class="muted small">也可以寫：<span class="en">${others.map(esc).join('　/　')}</span></div>`;
  if(q.e)h+=`<div class="exp">💡 ${esc(q.e)}</div>`;
  if(!ok&&user)h+=`<div class="row ai-only"><button class="btn ai" id="whyBtn" onclick="aiWhy()">🤖 為什麼錯？問 Claude</button></div><div id="whyOut"></div>`;
  h+='</div>';
  $('#fb').innerHTML=h;
  $('#actRow').innerHTML=`<button class="btn green" id="nextBtn" onclick="nextQ()">${R.i+1<R.items.length?'下一題 ➡️':'看成績 🏆'}</button>`;
  if(q.type==='reorder')drawReorder();else $('#ans').readOnly=true;
  $('#nextBtn').focus();
}
function nextQ(){R.i++;if(R.i>=R.items.length)finishRound();else renderQ()}
function finishRound(){
  R.done=true;logHistory(R.mode,R.correct,R.count);

/* ================= Claude：為什麼錯 ================= */
function qPrompt(q){
  if(q.type==='rewrite')return `${q.k}${q.h?`（${q.h}）`:''}${q.u?`（劃線部分：${q.u}）`:''}：${q.q}`;
  if(q.type==='combine')return `用 ${q.c} 把兩句合成一句：① ${q.s1} ② ${q.s2}`;
  return `把打亂的單字排成正確的句子，中文意思：${q.zh}`;
}
function whyCore(q,user){
  const prompt=`${AI_CTX}
學生在做全民英檢初級的「${MODE[q.type].name}」單句寫作題。
題目：${qPrompt(q)}
標準答案：${answersOf(q).join(' / ')}
學生的答案：${user.slice(0,300)}

請先判斷：學生的答案是不是其實也完全正確（文法、拼字都對，而且照題目要求做到了，只是寫法和標準答案不同）？
然後用 2～3 句話說明：錯在哪裡、為什麼、怎麼記比較好（例如「過去式要用 went」）。如果其實也正確，就說明為什麼也對。
只回覆一個 JSON 物件：{"acceptable": true 或 false, "explain": "你的說明"}`;
  return AI.json(prompt,{modelTier:'quick'});
}
async function aiWhyPaper(i){
  const user=$('#w'+i).value.trim();

  if(!AI)return;
  const myR=R,btn=$('#wb'+i);
  btn.disabled=true;$('#wo'+i).innerHTML=thinkingHTML();
  try{
    const r=await whyCore(R.items[i],user);
    if(R!==myR)return;
    let h=`<div class="aibox"><div class="fbt">🤖 Claude 老師說</div><div>${esc(S(r&&r.explain))}</div>`;
    if(r&&r.acceptable===true)h+=`<div class="row"><button class="btn green" onclick="mark(${i},true)">✅ 這樣寫也對，改成答對</button></div>`;
    $('#wo'+i).innerHTML=h+'</div>';
  }catch(e){if(R===myR){$('#wo'+i).innerHTML=`<div class="aibox">${esc(aiErrMsg(e))}</div>`;btn.disabled=false}}
}
async function aiPhotoCheck(file){
  if(!file||!AI||!R)return;
  const myR=R,out=$('#photoOut');
  out.innerHTML=thinkingHTML('Claude 正在看你的答案…（大約 20～60 秒）');
  const list=R.items.map((q,i)=>`${i+1}. 題目：${qPrompt(q)}\n   標準答案：${answersOf(q).join(' / ')}`).join('\n');
  const prompt=`${AI_CTX}
照片是學生手寫在紙上的答案（全民英檢初級單句寫作），題號對應下面的題目：
${list}

請辨認每一題學生寫了什麼，再判斷對不對：文法、拼字、大小寫、句尾標點都要對，而且要照題目要求。寫法和標準答案不同但也完全正確的，算對。看不清楚或沒寫的題目，ok 填 null。
只回覆一個 JSON 陣列，每題一個物件：[{"n": 題號, "read": "你看到學生寫的句子", "ok": true 或 false 或 null, "why": "錯的話用一句中文說明錯在哪，對的話填空字串"}]`;
  try{

      const i=Math.round(Number(x&&x.n))-1;if(!(i>=0&&i<R.items.length))return;
      const unsure=x.ok!==true&&x.ok!==false;
      R.notes[i]=`<div class="aibox"><div class="small">📷 Claude 看到你寫：<b class="en">${esc(S(x.read))||'（看不清楚）'}</b></div>
        ${S(x.why)?`<div class="small">🤖 ${esc(x.why)}</div>`:''}${unsure?'<div class="small">這題請自己對答案。</div>':''}</div>`;
      if(!unsure){R.marks[i]=x.ok;got++}
      $('#k'+i).innerHTML=keyItem(R.items[i],i);

  }catch(e){if(R===myR)out.innerHTML=`<div style="margin-top:8px">${esc(aiErrMsg(e))}</div>`}
  const p=$('#photo');if(p)p.value='';

async function aiWhy(){

function aiAccept(){

/* ================= Claude：出新題 ================= */
let GEN={type:'rewrite',focus:'過去式'};
const FOCUS=['現在式','過去式','進行式','未來式','疑問句','否定句','五大基本句型','連接詞','現在完成式','被動語態','比較級／最高級','附加問句','間接問句','關係代名詞 who / which / that','時間／條件子句（when, if, before, until）','too…to／so…that／enough','動名詞與不定詞','綜合'];
const CONJ=['and','but','so','because','or','when','if','before','after','until','while','although','as soon as','who','which','that','both … and','either … or','neither … nor','so … that'];
function viewGen(){
  if(!AI){app.innerHTML=`<div class="card">這個功能要在 claude.ai 上開啟網頁才能使用。<div class="row"><button class="btn" onclick="go('home')">🏠 回首頁</button></div></div>`;return}

    <div class="pick">${['rewrite','combine','reorder'].map(t=>`<button class="btn sec ${GEN.type===t?'active':''}" onclick="GEN.type='${t}';viewGen()">${MODE[t].name}</button>`).join('')}</div>
    <div class="inst" style="margin-top:18px">2️⃣ 想加強哪個文法？</div>
    <div class="pick">${FOCUS.map(f=>`<button class="btn sec ${GEN.focus===f?'active':''}" onclick="GEN.focus='${f}';viewGen()">${f}</button>`).join('')}</div>
    <div class="row"><button class="btn ai" id="genBtn" onclick="aiGen()">✨ 出 10 題開始練習</button></div>
    <div id="genOut"></div>
    <div class="muted small" style="margin-top:12px">Claude 出的題目答錯也會放進錯題本。題目是 AI 出的，偶爾可能有小錯，覺得怪怪的可以問爸媽或老師。</div>
  </div>`;
}
const stripQ=q=>{const o={...q};delete o.id;delete o.type;return o};
function cleanGen(type,x){
  if(!x||typeof x!=='object')return null;
  const str=v=>typeof v==='string'&&v.trim()?v.trim():null;
  const arr=v=>Array.isArray(v)?v.map(str).filter(Boolean):[];
  const e=str(x.e)||'';
  if(type==='rewrite'){
    const k=str(x.k),q=str(x.q),a=arr(x.a);if(!k||!q||!a.length)return null;
    const o={k,q,a,e};if(str(x.h))o.h=str(x.h);if(str(x.u)&&q.includes(str(x.u)))o.u=str(x.u);return o;
  }
  if(type==='combine'){
    const s1=str(x.s1),s2=str(x.s2),c=(str(x.c)||'').toLowerCase().replace(/\s*(\.\.\.|…)\s*/g,' … '),a=arr(x.a);
    if(!s1||!s2||!a.length||!CONJ.includes(c))return null;
    return {s1,s2,c,a,e};
  }
  const s=str(x.s);
  if(!s||!/^[A-Za-z][A-Za-z' ]*[A-Za-z][.?!]$/.test(s))return null;
  const n=s.split(' ').length;if(n<3||n>13)return null;
  const key=t=>norm(t).split(' ').sort().join(' ');
  return {s,zh:str(x.zh)||'',e,alt:arr(x.alt).filter(t=>key(t)===key(s)),keep:arr(x.keep)};
}

範例：${JSON.stringify(stripQ(REWRITE[2]))}`,
    combine:`每題是一個物件：{"s1":"第一句","s2":"第二句","c":"${CONJ.join('、')} 其中一個（成對的寫成 both … and）","a":["合併後的正確答案","其他也正確的寫法"],"e":"一句中文說明"}

- 10 題內容都不同。答案必須完全正確；a 裡要列出所有常見的正確寫法（縮寫 don't / do not 會自動視為相同，不用重複列）。
- 中文說明要短，像「過去式要用 went」這樣。
${fmt}
只回覆一個 JSON 陣列，裡面放 10 個題目物件，不要其他文字。`;
  try{

    if(!$('#genOut'))return;
    $('#genOut').innerHTML=`<div class="aibox">${esc(aiErrMsg(e))}</div>`;$('#genBtn').disabled=false;
  }
}

function paraCheck(){
  const s=$('#para').value.trim(),tips=[];
  if(!s){toast('先寫一些內容喔！');return}
  const n=countWords(s);
  const sents=s.split(/(?<=[.!?])\s+/).filter(x=>x.trim());
  if(n<35)tips.push(`字數只有 ${n} 字，用 5W1H 再多加一兩句。`);
  if(!/[.!?]["”]?$/.test(s))tips.push('最後一句要加上句號 . 或驚嘆號 !');
  const low=sents.filter(x=>/^[a-z]/.test(x.trim()));
  if(low.length)tips.push(`這些句子開頭要大寫：<span class="en">${low.map(x=>esc(x.trim().split(' ').slice(0,3).join(' '))+'…').join('、')}</span>`);
  if(/(^|[\s,.])i([\s,.']|$)/.test(s))tips.push('「我」要寫大寫的 <b class="en">I</b>，不是小寫 i。');
  if(/[，。？！、]/.test(s))tips.push('有中文標點符號，要改成英文的 , . ? !');
  if(/ ,|,(?=\S)/.test(s))tips.push('逗號後面要空一格，前面不要空格。');
  const longS=sents.filter(x=>countWords(x)>25);
  if(longS.length)tips.push('有句子太長了，可以拆成兩句或用 and / but / so 好好連接。');
  if(sents.length<4)tips.push(`目前只有 ${sents.length} 句，試著寫到 5～7 句。`);

    ?`<div class="fb bad"><div class="fbt">🔍 可以再改進的地方</div><ul style="margin:0">${tips.map(x=>`<li>${x}</li>`).join('')}</ul><div class="muted small" style="margin-top:6px">（小檢查只看格式，文法要請 AI 或老師幫忙看）</div></div>`

}

  const t=TOPICS[i],s=$('#para').value.trim();
  if(!s){toast('先寫一些內容喔！');return}
  const prompt=`請你當英文老師，用繁體中文幫我批改這篇「全民英檢初級」段落寫作。\n題目：${t.title}（${t.en}）— ${t.prompt}\n請：1. 用 GEPT 初級標準給分（0～5 分）2. 列出文法、拼字錯誤並說明 3. 給我修改後的版本（用初級程度的字）。\n\n我的文章：\n${s}`;
  const done=()=>{toast('已複製！貼到 ChatGPT 或 Gemini 就可以了');$('#typeOut').innerHTML=`<div class="fb ok">📋 已經複製好了！打開 ChatGPT 或 Gemini，按 Ctrl + V 貼上送出就可以。</div>`};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=prompt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('複製失敗，請手動複製')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(prompt).then(done,fallback);else fallback();
}
function paraSample(i){
  const t=TOPICS[i];
  $('#paraOut').innerHTML=`<div class="fb ok"><div class="fbt">👀 範文（${countWords(t.sample)} 字）<button class="mini" onclick="speak(TOPICS[${i}].sample,.85)">🔊</button></div>
    <div class="en" style="font-size:22px">${esc(t.sample)}</div><div class="muted small" style="margin-top:6px">先自己寫完再看，會進步比較快喔！</div></div>`;
}

/* ================= 錄音元件（複誦、朗讀共用） ================= */
let recTarget=null,recMode=null;
function recHTML(){return `<div class="row"><button class="btn red" id="recBtn" onclick="toggleRec()">🎙️ 開始錄音</button><span id="recState" class="muted"></span></div><div class="live en" id="live"></div><div id="recOut"></div>`}
async function toggleRec(){
  const btn=$('#recBtn');
  if(!Rec.on){
    if(window.speechSynthesis)speechSynthesis.cancel();
    $('#recOut').innerHTML='';$('#live').textContent='';
    try{await Rec.start(t=>{const l=$('#live');if(l)l.textContent='🗣️ '+t})}catch(e){$('#recOut').innerHTML=micErr(e);return}
    btn.textContent='⏹️ 停止錄音';btn.classList.add('pulse');$('#recState').textContent='錄音中…說完按「停止」';
  }else{
    btn.disabled=true;$('#recState').textContent='處理中…';
    const res=await Rec.stop();
    if(!$('#recBtn'))return;
    btn.disabled=false;btn.textContent='🎙️ 再錄一次';btn.classList.remove('pulse');$('#recState').textContent='';$('#live').textContent='';
    let h=res.url?`<div style="margin-top:10px"><b>▶️ 聽聽自己的聲音：</b><br><audio controls src="${res.url}"></audio></div>`
      :REC_AUDIO?'':`<div class="muted small" style="margin-top:10px">（平板上只做語音辨識，沒有錄音可以重播）</div>`;
    if(res.text){
      const c=compare(recTarget,res.text);
      logHistory(recMode,c.hit,c.total);
      h+=`<div class="fb ${c.score>=70?'ok':'bad'}"><div class="fbt">${stars(c.score)} 正確率 ${c.score}%</div>
        <div class="muted small">原句（<span class="w-miss">紅色</span>是沒念到或念得不清楚的字）：</div>
        <div class="diffline en">${wordsHTML(c.A,c.okA,'w-ok','w-miss')}</div>
        <div class="muted small" style="margin-top:8px">電腦聽到你說（<span class="w-extra">黃色</span>是跟原句不一樣的字）：</div>
        <div class="diffline en">${wordsHTML(c.B,c.okB,'','w-extra')}</div>
        <div class="muted small" style="margin-top:6px">${c.score>=90?'發音很清楚！':'紅色的字可以按 🔊 再聽一次，跟著念幾遍。'}</div></div>`;
    }else h+=`<div class="fb bad">${noTextMsg(res.err)}</div>`;
    $('#recOut').innerHTML=h;
  }
}
const srNote=()=>IN_CLAUDE?`<div class="fb bad small">⚠️ 在 claude.ai 上只能聽、不能錄音。要錄音、看發音正確率，請打開電腦裡的 gept.html 檔案。</div>`
  :SRClass?'':`<div class="fb bad small">⚠️ 這個瀏覽器不支援語音辨識，請用電腦版 Chrome。錄音和重播仍可使用。</div>`;

/* ================= 口說題庫選擇（課本各回 / 網頁內建） ================= */
let SRC=DB.src||'0';
const repList=()=>SRC==='strat'?STRAT_SPEAK.repeat:SRC==='mine'?REPEAT:ROUNDS[+SRC].repeat;
const readSent=()=>SRC==='strat'?STRAT_SPEAK.sentences:SRC==='mine'?READ_SENT:ROUNDS[+SRC].read.sentences;
const readPass=()=>SRC==='strat'?STRAT_SPEAK.passages:SRC==='mine'?READ_PASS:[ROUNDS[+SRC].read.passage];
const askList=()=>SRC==='strat'?STRAT_SPEAK.answer:SRC==='mine'?QUESTIONS:ROUNDS[+SRC].answer.map(x=>({q:x.q,a:x.sample}));
const curQ=()=>askList()[AQ.order[AQ.i]];
function setSrc(v,view){SRC=v;DB.src=v;save();REP.i=0;RD.i=0;AQ.i=0;AQ.order=null;go(view)}
function srcPicker(view){
  return `<div class="row" style="margin:0 0 14px"><label for="srcSel"><b>📚 題庫：</b></label>
    <select id="srcSel" class="sel" onchange="setSrc(this.value,'${view}')">
      ${ROUNDS.map((r,i)=>`<option value="${i}" ${SRC===String(i)?'selected':''}>課本 ${esc(r.name)}</option>`).join('')}
      <option value="mine" ${SRC==='mine'?'selected':''}>綜合練習題（網頁內建）</option>
      <option value="strat" ${SRC==='strat'?'selected':''}>🎯 攻略特訓（數字・時態・長句）</option></select></div>
    ${SRC==='strat'&&SPEAK_TIP[view]?`<div class="paper-tip">${SPEAK_TIP[view]}</div>`:''}`;
}

/* ================= 複誦 ================= */
let REP={i:0,show:false};
function viewRepeat(){
  const list=repList();if(REP.i>=list.length)REP.i=0;
  const t=list[REP.i];recTarget=t;recMode='repeat';
  app.innerHTML=`<h2>👂 複誦　<span class="muted" style="font-size:20px">第 ${REP.i+1} / ${list.length} 句</span></h2>
  ${srcPicker('repeat')}${srNote()}
  <div class="card">
    <div class="inst">1️⃣ 先聽句子（考試時看不到句子，要用聽的！）</div>
    <div class="row"><button class="btn blue" onclick="speak(recTarget,.9)">🔊 正常速度</button><button class="btn teal" onclick="speak(recTarget,.6)">🐢 慢慢念</button>
      <button class="btn sec" onclick="REP.show=!REP.show;viewRepeat()">${REP.show?'🙈 藏起句子':'👀 偷看句子'}</button></div>
    <div style="margin-top:14px">${REP.show?`<div class="big-en en">${esc(t)}</div>`:`<div class="hidebox">句子藏起來了，先試著用聽的 👂</div>`}</div>
    <div class="inst" style="margin-top:20px">2️⃣ 按下錄音，跟著說一次</div>
    ${recHTML()}
    <div class="row" style="justify-content:space-between;margin-top:22px">
      <button class="btn sec" ${REP.i===0?'disabled':''} onclick="REP.i--;REP.show=false;go('repeat')">⬅️ 上一句</button>
      <button class="btn" onclick="REP.i=(REP.i+1)%${list.length};REP.show=false;go('repeat')">下一句 ➡️</button></div>
  </div>`;
  setTimeout(()=>speak(t,.9),300);
}

/* ================= 朗讀 ================= */
let RD={kind:'sent',i:0};
function viewRead(){
  const list=RD.kind==='sent'?readSent():readPass();if(RD.i>=list.length)RD.i=0;
  const t=list[RD.i];recTarget=t;recMode='read';
  app.innerHTML=`<h2>📖 朗讀</h2>${srcPicker('read')}${srNote()}
  <div class="tabs"><button class="btn sec ${RD.kind==='sent'?'active':''}" onclick="RD={kind:'sent',i:0};go('read')">句子</button>
    <button class="btn sec ${RD.kind==='pass'?'active':''}" onclick="RD={kind:'pass',i:0};go('read')">短文</button></div>
  <div class="card">
    <div class="muted">第 ${RD.i+1} / ${list.length} ${RD.kind==='sent'?'句':'篇'}　・　先自己念念看，不會的再聽示範</div>
    <div class="big-en en" style="${RD.kind==='pass'?'font-size:27px;font-weight:600;line-height:1.7':''}">${esc(t)}</div>
    <div class="row"><button class="btn blue" onclick="speak(recTarget,.9)">🔊 聽示範</button><button class="btn teal" onclick="speak(recTarget,.65)">🐢 慢速示範</button></div>
    <div class="inst" style="margin-top:20px">🎙️ 錄下你的朗讀</div>
    ${recHTML()}
    <div class="row" style="justify-content:space-between;margin-top:22px">
      <button class="btn sec" ${RD.i===0?'disabled':''} onclick="RD.i--;go('read')">⬅️ 上一個</button>
      <button class="btn" onclick="RD.i=(RD.i+1)%${list.length};go('read')">下一個 ➡️</button></div>
  </div>`;
}

/* ================= 回答問題 ================= */
let AQ={i:0,show:false,order:null};
function viewAnswer(){
  if(!AQ.order){const ix=askList().map((_,i)=>i);AQ.order=SRC==="mine"?shuffle(ix):ix}
  const q=curQ();
  app.innerHTML=`<h2>💬 回答問題　<span class="muted" style="font-size:20px">第 ${AQ.i+1} / ${askList().length} 題</span></h2>${srcPicker('answer')}${srNote()}
  <div class="card">
    <div class="muted">按「開始」後會念題目，嗶一聲之後有 <b>15 秒</b>可以回答。盡量說<b>完整的句子</b>，最好說兩句！</div>
    <div style="margin-top:12px">${AQ.show?`<div class="big-en en">${esc(q.q)}</div>`:`<div class="hidebox">題目藏起來了，要用聽的 👂</div>`}</div>
    <div class="timer" id="timer">15</div>
    <div style="text-align:center" class="muted" id="ansState">準備好了嗎？</div>
    <div class="row" style="justify-content:center" id="ansBtns">
      <button class="btn green" id="ansGo" onclick="ansStart()">▶️ 開始</button>
      <button class="btn blue" onclick="speak(curQ().q,.85)">🔁 再聽一次題目</button>
      <button class="btn sec" onclick="AQ.show=!AQ.show;go('answer')">${AQ.show?'🙈 藏起題目':'👀 看題目'}</button>
    </div>
    <div class="live en" id="live" style="text-align:center"></div>
    <div id="recOut"></div>
    <div class="row" style="justify-content:space-between;margin-top:22px">
      <button class="btn sec" ${AQ.i===0?'disabled':''} onclick="AQ.i--;AQ.show=false;go('answer')">⬅️ 上一題</button>
      <button class="btn" onclick="AQ.i=(AQ.i+1)%${askList().length};AQ.show=false;go('answer')">下一題 ➡️</button></div>
  </div>`;
}
async function ansStart(){
  const q=curQ();const myI=AQ.i;
  $('#ansBtns').innerHTML=`<button class="btn red pulse" id="ansStop" style="visibility:hidden" onclick="ansStop()">⏹️ 我說完了</button>`;
  $('#recOut').innerHTML='';$('#ansState').textContent='👂 仔細聽題目…';
  await speak(q.q,.85);await sleep(400);
  if(AQ.i!==myI||!$('#timer'))return;
  beep();
  // 不能錄音時（例如在 claude.ai 上）還是照樣倒數，讓學生大聲說，之後再打字
  let noMic=false;
  try{await Rec.start(t=>{const l=$('#live');if(l)l.textContent='🗣️ '+t})}
  catch(e){noMic=true;$('#recOut').innerHTML=IN_CLAUDE
    ?`<div class="fb ok small">🗣️ 這裡不能錄音，但一樣可以練習：現在就<b>大聲說出你的答案</b>，時間到再把說的話打下來給 Claude 看。</div>`
    :micErr(e)}
  AQ.running=true;
  $('#ansStop').style.visibility='visible';$('#ansState').textContent=noMic?'🗣️ 開始大聲回答！':'🎙️ 開始回答！';
  let left=15;const tm=$('#timer');tm.textContent=left;
  clearInterval(ansTimer);
  ansTimer=setInterval(()=>{left--;tm.textContent=left;if(left<=5)tm.classList.add('hot');if(left<=0)ansStop()},1000);
}
async function ansStop(){
  clearInterval(ansTimer);
  if(!AQ.running)return;
  AQ.running=false;
  $('#ansState').textContent='處理中…';$('#ansBtns').innerHTML='';
  const res=Rec.on?await Rec.stop():{url:null,text:'',noMic:true};
  if(!$('#timer'))return;
  const q=curQ();
  $('#ansState').textContent='⏰ 時間到！';$('#live').textContent='';
  const n=res.text?countWords(res.text):0;
  let h=res.url?`<div style="margin-top:10px"><b>▶️ 聽聽自己的回答：</b><br><audio controls src="${res.url}"></audio></div>`:'';
  if(res.text)h+=`<div class="fb ${n>=8?'ok':'bad'}"><div class="fbt">${n>=12?'⭐⭐⭐ 說得很完整！':n>=8?'⭐⭐ 不錯喔！':'💪 可以再多說一點'}</div>
     <div class="muted small">電腦聽到你說（${n} 個字）：</div><div class="diffline en">${esc(res.text)}</div>
     ${n<8?'<div class="small">試著用完整句子回答，再加一句原因或細節（because…、I also…）。</div>':''}</div>`;
  else if(!res.noMic)h+=`<div class="fb bad">${noTextMsg(res.err)}</div>`;
  h+=`<div class="aibox ai-only"><div class="fbt">🤖 讓 Claude 看看你的回答</div>
     <div class="muted small">${res.text?'電腦聽到的字如果不對，可以先改成你真正說的話。':'把你剛剛說的英文打在下面（說了什麼就打什麼）。'}</div>
     <textarea id="ansText" class="en" style="min-height:110px" spellcheck="false" placeholder="I usually...">${esc(res.text)}</textarea>
     <div class="row"><button class="btn ai" id="ansAiBtn" onclick="aiAnswer()">🤖 請 Claude 給評語</button></div><div id="ansAiOut"></div></div>`;
  h+=`<div class="fb ok"><div class="muted small">題目：</div><div class="en" style="font-size:24px;font-weight:700">${esc(q.q)}</div>
     <div class="muted small" style="margin-top:6px">參考回答：<button class="mini" onclick="speak(curQ().a,.85)">🔊</button></div><div class="en right" style="font-size:24px">${esc(q.a)}</div></div>`;
  $('#recOut').innerHTML=h;
  $('#ansBtns').innerHTML=`<button class="btn green" onclick="go('answer')">🔄 這題再答一次</button>`;
}
async function aiAnswer(){
  const said=$('#ansText').value.trim();
  if(!said){toast('先把你說的話打上去喔！');return}
  if(!AI)return;
  const q=curQ(),myI=AQ.i,btn=$('#ansAiBtn'),out=$('#ansAiOut');
  btn.disabled=true;out.innerHTML=thinkingHTML();
  const prompt=`${AI_CTX}
學生在練習全民英檢初級口說的「回答問題」：聽到問題後，15 秒內用英文回答。
問題：${q.q}
學生的回答（語音辨識轉成的文字或學生自己打的，可能有辨識錯字；看不出是辨識錯還是學生說錯時，不要算學生錯）：
"""
${said.slice(0,1000)}
"""
請評估：有沒有回答到問題、句子是否完整、文法和用字是否正確、內容是否夠（最好有 2 句，或加上原因、細節）。
只回覆一個 JSON 物件：
{"stars": 1 到 3 的整數（3 = 切題完整又正確，2 = 切題但有小錯或太短，1 = 沒答到問題或錯很多）, "comment": "一兩句中文評語和鼓勵", "fixes": [{"wrong": "說錯的片段", "right": "正確說法", "why": "簡短中文說明"}], "better": "更好的回答範例（英文 2 句，用初級程度的字，盡量保留學生的意思）"}
fixes 最多 4 個，沒有錯就給空陣列。`;
  try{
    const r=await AI.json(prompt,{modelTier:'quick'});
    if(AQ.i!==myI||!document.body.contains(out))return;
    const st=Math.max(1,Math.min(3,Math.round(Number(r&&r.stars)||1)));
    const fx=fixesHTML(r.fixes);
    out.innerHTML=`<div style="margin-top:12px"><div class="fbt">${'⭐'.repeat(st)} Claude 老師說</div>
      <div>${esc(S(r.comment))}</div>
      ${fx?`<div style="margin-top:8px"><b>✏️ 可以這樣改</b>${fx}</div>`:''}
      ${S(r.better)?`<div style="margin-top:8px"><b>💡 更好的說法</b> <button class="mini" onclick="speak(document.getElementById('better').textContent,.85)">🔊</button></div>
        <div id="better" class="en" style="font-size:22px;background:#fff;border-radius:12px;padding:8px 12px">${esc(r.better)}</div>`:''}
      <div class="muted small" style="margin-top:6px">按 🔊 聽一次，再跟著說幾遍！</div></div>`;
  }catch(e){if(document.body.contains(out))out.innerHTML=`<div style="margin-top:10px">${esc(aiErrMsg(e))}</div>`}
  btn.disabled=false;
}

/* ================= 紀錄 ================= */
function viewStats(){
  const H=DB.history;
  const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  const sum=m=>{const x=H.filter(h=>h.mode===m);const c=x.reduce((s,h)=>s+h.c,0),n=x.reduce((s,h)=>s+h.n,0);return {times:x.length,p:n?Math.round(c/n*100):null}};
  const recent=H.filter(h=>WRITE_MODES.includes(h.mode)).slice(-12);
  app.innerHTML=`<h2>📊 練習紀錄</h2>
  ${H.length?'':'<div class="card">還沒有紀錄，先去練習吧！</div>'}
  <div class="grid">${Object.keys(MODE).map(m=>{const s=sum(m);return `<div class="card" style="margin:0;border-top:8px solid ${MODE[m].color}">
     <div style="font-weight:800">${MODE[m].name}</div><div class="score" style="font-size:34px">${s.p===null?'—':s.p+'%'}</div>
     <div class="muted small">${m==='repeat'||m==='read'?'平均發音正確率':'平均答對率'}・練習 ${s.times} 次</div></div>`}).join('')}</div>
  ${recent.length?`<div class="card" style="margin-top:18px"><b>✏️ 最近 ${recent.length} 次寫作答對率</b>
     <div class="bars" style="margin-top:30px">${recent.map(h=>{const p=Math.round(h.c/h.n*100);return `<div style="height:${Math.max(p,3)}%" title="${MODE[h.mode].name}"><span>${p}%</span></div>`}).join('')}</div></div>`:''}
  ${H.length?`<div class="card"><b>🕒 最近的練習</b><table><tr><th>時間</th><th>項目</th><th>結果</th><th>答對率</th></tr>
     ${H.slice(-30).reverse().map(h=>`<tr><td>${fmt(h.t)}</td><td>${MODE[h.mode]?MODE[h.mode].name:h.mode}</td>
       <td>${h.mode==='repeat'||h.mode==='read'?`念對 ${h.c} / ${h.n} 字`:h.mode==='para'?`${h.c} / 5 級分`:`${h.c} / ${h.n} 題`}</td><td><b>${Math.round(h.c/h.n*100)}%</b></td></tr>`).join('')}</table>
     <div class="row"><button class="btn sec" id="clrHist" onclick="clearHistory()">🧹 清除紀錄</button><span class="muted small">（錯題本不會被清除）</span></div></div>`:''}`;
}
function clearHistory(){
  const b=$('#clrHist');
  if(!b.dataset.sure){b.dataset.sure='1';b.textContent='⚠️ 確定要清除？再按一次';b.classList.add('red');return}
  DB.history=[];save();viewStats();toast('紀錄已清除');
}

renderCountdown();
viewHome();
</script>
